<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" fill="#297B83" /></marker></defs><rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F7F4EE" /><g id="heading" data-pptx-bounds="48 32 1184 114" font-weight="normal"><text x="48" y="60" font-size="18" fill="#59616C">AI 协作入门  /  01</text><text x="48" y="123" font-family="SimSun" font-size="48" fill="#243142">把“整理一下”变成能验收的任务</text></g><g id="vague-request" data-pptx-bounds="48 162 1184 58"><text x="48" y="201" font-family="SimSun" font-size="36" fill="#59616C" font-weight="normal">“帮我整理一下会议记录。”</text></g><g id="annotation-1" data-pptx-bounds="64 237 1168 54"><text font-size="32" fill="#202933"><tspan x="78" y="269">依据会议原文和会后补充，</tspan></text><line x1="800" y1="259" x2="852" y2="259" stroke="#C9C2B8" stroke-width="2" /><text x="880" y="269" font-size="26" fill="#B8372C" font-weight="normal">01  材料</text></g><g id="annotation-2" data-pptx-bounds="64 295 1168 54"><text font-size="32" fill="#202933"><tspan x="78" y="327">输出一页纪要和 Excel 行动清单。</tspan></text><line x1="800" y1="317" x2="852" y2="317" stroke="#C9C2B8" stroke-width="2" /><text x="880" y="327" font-size="26" fill="#B8372C" font-weight="normal">02  目标与格式</text></g><g id="annotation-3" data-pptx-bounds="64 353 1168 98"><text font-size="32" fill="#202933"><tspan x="78" y="385">会后确认覆盖原安排；</tspan><tspan x="78" y="429">每个待办列负责人、期限、来源。</tspan></text><line x1="800" y1="375" x2="852" y2="375" stroke="#C9C2B8" stroke-width="2" /><text x="880" y="385" font-size="26" fill="#B8372C" font-weight="normal">03  处理规则</text></g><g id="annotation-4" data-pptx-bounds="64 455 1168 98"><text font-size="32" fill="#202933"><tspan x="78" y="487">未说明的信息留空或标为待确认，</tspan><tspan x="78" y="531">采购建议不要写成批准。</tspan></text><line x1="800" y1="477" x2="852" y2="477" stroke="#C9C2B8" stroke-width="2" /><text x="880" y="487" font-size="26" fill="#B8372C" font-weight="normal">04  边界</text></g><g id="annotation-5" data-pptx-bounds="64 557 1168 54"><text font-size="32" fill="#202933"><tspan x="78" y="589">完成后检查日期变更和来源能否对上。</tspan></text><line x1="800" y1="579" x2="852" y2="579" stroke="#C9C2B8" stroke-width="2" /><text x="880" y="589" font-size="26" fill="#B8372C" font-weight="normal">05  验收</text></g><g id="check-reminder" data-pptx-bounds="48 622 1184 40"><text x="78" y="650" font-size="26" fill="#59616C" font-weight="normal">要求变得可检查；生成以后，仍要拿原文核对。</text></g><g id="footer" data-pptx-bounds="48 670 1184 34" fill="#59616C" font-size="18" font-weight="normal"><text x="48" y="692">企业 AI 效率分享 · 三页代表稿 · 2026.11</text><text x="1160" y="692">01 / 03</text></g></svg>
