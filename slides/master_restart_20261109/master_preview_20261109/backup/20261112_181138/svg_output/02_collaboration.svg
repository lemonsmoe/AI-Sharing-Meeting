<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" fill="#297B83" /></marker></defs><rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F7F4EE" /><g id="heading" data-pptx-bounds="48 32 1184 114" font-weight="normal"><text x="48" y="60" font-size="18" fill="#59616C">AI 协作入门  /  02</text><text x="48" y="123" font-family="SimSun" font-size="48" fill="#243142">这些组件，在同一次工作里配合</text></g><g id="collaboration-diagram" data-pptx-bounds="47 190 1186 474"><g id="harness-field"><rect x="48" y="193" width="1184" height="430" fill="none" stroke="#C9C2B8" /><text x="72" y="230" font-size="26" fill="#59616C" font-weight="normal">Harness 运行框架</text><text x="700" y="230" font-size="26" fill="#59616C" font-weight="normal">环境 · 调度 · 检查 · 接续</text></g><g id="prompt" font-weight="normal"><text x="72" y="296" font-size="32" fill="#B8372C">提示词</text><text x="72" y="334" font-size="26" fill="#202933">说明目标与交付要求</text></g><g id="work" font-weight="normal"><text x="392" y="297" font-size="32" fill="#243142">Agent 推进工作</text><text x="392" y="342" font-size="26" fill="#202933">读取材料 → 选择下一步 → 调用工具 → 检查结果</text></g><g id="prompt-link"><line x1="338" y1="314" x2="378" y2="314" stroke="#297B83" stroke-width="2" marker-end="url(#arrow)" /></g><g id="support-0"><line x1="210" y1="403" x2="450" y2="365" stroke="#297B83" stroke-width="2" marker-end="url(#arrow)" /><text x="80" y="448" font-size="32" fill="#243142" font-weight="normal">Skill</text><text x="80" y="492" font-size="26" fill="#202933" font-weight="normal">提供可复用做法</text><text x="80" y="539" font-size="26" fill="#59616C" font-weight="normal">Skill 可以没有 MCP</text></g><g id="support-1"><line x1="580" y1="403" x2="580" y2="365" stroke="#297B83" stroke-width="2" marker-end="url(#arrow)" /><text x="450" y="448" font-size="32" fill="#243142" font-weight="normal">API / MCP</text><text x="450" y="492" font-size="26" fill="#202933" font-weight="normal">连接数据和操作</text><text x="450" y="539" font-size="26" fill="#59616C" font-weight="normal">MCP 是可选接口</text></g><g id="support-2"><line x1="970" y1="403" x2="970" y2="365" stroke="#297B83" stroke-width="2" marker-end="url(#arrow)" /><text x="840" y="448" font-size="32" fill="#243142" font-weight="normal">项目记录</text><text x="840" y="492" font-size="26" fill="#202933" font-weight="normal">保存决定与进度</text><text x="840" y="539" font-size="26" fill="#59616C" font-weight="normal">不等于更新模型参数</text></g><g id="delivery" font-weight="normal"><text x="72" y="601" font-size="32" fill="#B8372C">交付：会议纪要 + 行动表</text><text x="590" y="601" font-size="26" fill="#202933">检查结果，再决定是否继续</text></g><g id="diagram-limit"><text x="72" y="655" font-size="18" fill="#59616C" font-weight="normal">概念示意：这些组件可以配合，不是相互淘汰的升级链；不表示公司已接入。</text></g></g><g id="footer" data-pptx-bounds="48 670 1184 34" fill="#59616C" font-size="18" font-weight="normal"><text x="48" y="692">企业 AI 效率分享 · 三页代表稿 · 2026.11</text><text x="1160" y="692">02 / 03</text></g></svg>
