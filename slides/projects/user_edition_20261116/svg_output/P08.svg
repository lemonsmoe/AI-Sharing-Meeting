<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect width="1280" height="720" fill="#F6F3EC"/>
  <text x="80" y="104" font-family="Microsoft YaHei" font-size="44" font-weight="bold" fill="#171715">上下文：它干活时手里拿着的背景信息</text>
  <g font-family="Microsoft YaHei">
    <rect x="80" y="220" width="400" height="180" rx="12" fill="#FFFFFF" stroke="#E3DFD5" stroke-width="1.5"/>
    <text x="120" y="285" font-size="26" fill="#171715">「帮我看一下几点开始」</text>
    <text x="120" y="350" font-size="22" fill="#7A7A74">只发这句话，它手里没有材料</text>
    <text x="640" y="310" font-size="40" fill="#C50000">→</text>
    <rect x="800" y="220" width="400" height="180" rx="12" fill="#FFFFFF" stroke="#C50000" stroke-width="2"/>
    <text x="840" y="270" font-size="26" font-weight="bold" fill="#171715">活动通知</text>
    <text x="840" y="320" font-size="22" fill="#171715">时间：周五 16:00</text>
    <text x="840" y="360" font-size="22" fill="#171715">地点：A 会议室</text>
    <text x="120" y="500" font-size="26" fill="#171715">把材料交给它，这份材料才进得了它的上下文。</text>
    <text x="120" y="552" font-size="26" fill="#171715">就像跟同事交接工作：背景信息要递到对方手里。</text>
  </g>
</svg>
