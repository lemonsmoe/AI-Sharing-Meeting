<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect width="1280" height="720" fill="#F6F3EC"/>
  <text x="80" y="104" font-family="Microsoft YaHei" font-size="44" font-weight="bold" fill="#171715">MCP：让 AI 接外部工具和数据的协议</text>
  <g font-family="Microsoft YaHei">
    <rect x="80" y="220" width="520" height="220" rx="12" fill="#FFFFFF" stroke="#E3DFD5" stroke-width="1.5"/>
    <text x="120" y="290" font-size="30" font-weight="bold" fill="#171715">Skill＝做法说明书</text>
    <text x="120" y="360" font-size="24" fill="#7A7A74">可复用的步骤怎么走</text>
    <rect x="680" y="220" width="520" height="220" rx="12" fill="#FFFFFF" stroke="#C50000" stroke-width="2"/>
    <text x="720" y="290" font-size="30" font-weight="bold" fill="#C50000">MCP＝接线的插头标准</text>
    <text x="720" y="360" font-size="24" fill="#171715">按约定标准对接，接上就能用</text>
  </g>
  <text x="80" y="540" font-family="Microsoft YaHei" font-size="26" fill="#171715">比如：经授权后，AI 可以通过 MCP 读取某个会议服务里的记录。</text>
</svg>
