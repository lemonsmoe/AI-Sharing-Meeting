<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect width="1280" height="720" fill="#F6F3EC"/>
  <text x="80" y="104" font-family="Microsoft YaHei" font-size="44" font-weight="bold" fill="#171715">提示词 4｜AI 不是完美的许愿机</text>
  <g font-family="Microsoft YaHei">
    <rect x="80" y="190" width="540" height="250" rx="12" fill="#FFFFFF" stroke="#E3DFD5" stroke-width="1.5"/>
    <text x="120" y="250" font-size="30" fill="#171715">「太满了」</text>
    <text x="120" y="305" font-size="24" fill="#7A7A74">自己的感受很明确，</text>
    <text x="120" y="345" font-size="24" fill="#7A7A74">对方还得猜一轮。</text>
    <rect x="660" y="190" width="540" height="250" rx="12" fill="#FFFFFF" stroke="#C50000" stroke-width="2"/>
    <text x="700" y="250" font-size="30" font-weight="bold" fill="#C50000">直接说到位置</text>
    <text x="700" y="305" font-size="24" fill="#171715">· 第二页右下角三行说明全进备注</text>
    <text x="700" y="345" font-size="24" fill="#171715">· 主屏只留一句结论</text>
    <text x="700" y="385" font-size="24" fill="#171715">· 表格数字保留原样，我还要核原件</text>
  </g>
  <text x="80" y="530" font-family="Microsoft YaHei" font-size="28" fill="#171715">提意见就像甲方给乙方对需求：可以不懂行，但得说清「差在哪」。</text>
  <text x="80" y="610" font-family="Microsoft YaHei" font-size="28" font-weight="bold" fill="#171715">它动手越多，你越要在中间看一眼——所以先做小样。</text>
</svg>
