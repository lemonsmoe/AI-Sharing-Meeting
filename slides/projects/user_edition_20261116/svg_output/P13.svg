<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect width="1280" height="720" fill="#F6F3EC"/>
  <text x="80" y="104" font-family="Microsoft YaHei" font-size="44" font-weight="bold" fill="#171715">提示词 2｜补齐上下文</text>
  <g font-family="Microsoft YaHei">
    <rect x="80" y="190" width="1120" height="210" rx="12" fill="#FFFFFF" stroke="#E3DFD5" stroke-width="1.5"/>
    <text x="120" y="245" font-size="26" font-weight="bold" fill="#C50000">跟给新同事交接一样，把背景说清楚：</text>
    <text x="120" y="305" font-size="26" fill="#171715">· 哪份文件已经过时了</text>
    <text x="120" y="350" font-size="26" fill="#171715">· 哪一列是含税价</text>
    <text x="120" y="395" font-size="26" fill="#171715">· 哪段话是别人提的建议</text>
    <rect x="80" y="430" width="1120" height="130" rx="12" fill="#FFFFFF" stroke="#E3DFD5" stroke-width="1.5"/>
    <text x="120" y="485" font-size="26" font-weight="bold" fill="#171715">注意：上下文是有容量的</text>
    <text x="120" y="530" font-size="24" fill="#7A7A74">聊得越长、塞得越多，它越要一遍遍压缩，越可能顾此失彼。各家上限不同，以官方说明为准。</text>
  </g>
  <text x="80" y="640" font-family="Microsoft YaHei" font-size="28" font-weight="bold" fill="#171715">同部门不用说的事，换个人接手就得交代一遍——AI 也一样。</text>
</svg>
