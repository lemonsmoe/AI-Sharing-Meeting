<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect width="1280" height="720" fill="#F6F3EC"/>
  <text x="80" y="104" font-family="Microsoft YaHei" font-size="44" font-weight="bold" fill="#171715">平时说的「AI」，其实是好几件事</text>
  <g font-family="Microsoft YaHei">
    <rect x="80" y="200" width="360" height="320" rx="12" fill="#FFFFFF" stroke="#E3DFD5" stroke-width="1.5"/>
    <text x="120" y="270" font-size="32" font-weight="bold" fill="#171715">软件</text>
    <text x="120" y="330" font-size="24" fill="#171715">你点开的应用</text>
    <text x="120" y="368" font-size="24" fill="#171715">发消息、传图片、切功能</text>
    <text x="120" y="450" font-size="22" fill="#7A7A74">豆包、飞书、Codex……</text>
    <rect x="460" y="200" width="360" height="320" rx="12" fill="#FFFFFF" stroke="#E3DFD5" stroke-width="1.5"/>
    <text x="500" y="270" font-size="32" font-weight="bold" fill="#C50000">模型</text>
    <text x="500" y="330" font-size="24" fill="#171715">背后答题的那一个</text>
    <text x="500" y="368" font-size="24" fill="#171715">把输入处理成结果</text>
    <text x="500" y="450" font-size="22" fill="#7A7A74">Doubao Seed 2.1 Pro 等型号</text>
    <rect x="840" y="200" width="360" height="320" rx="12" fill="#FFFFFF" stroke="#E3DFD5" stroke-width="1.5"/>
    <text x="880" y="270" font-size="32" font-weight="bold" fill="#171715">文件与权限</text>
    <text x="880" y="330" font-size="24" fill="#171715">能不能读文件</text>
    <text x="880" y="368" font-size="24" fill="#171715">能不能写、能不能发出去</text>
    <text x="880" y="450" font-size="22" fill="#7A7A74">三种能力是三种权限</text>
  </g>
  <text x="80" y="620" font-family="Microsoft YaHei" font-size="26" fill="#171715">同一个名字背后，软件、模型、文件能力是三个不同的东西。</text>
</svg>
