  <text x="80" y="104" font-size="44" font-weight="bold" fill="#171715">提示词 2｜像给新同事交接一样补齐背景</text>
  <g id="handoff" data-pptx-bounds="80 210 1120 235" fill="#171715">
    <line x1="440" y1="210" x2="440" y2="445" stroke="#B8B4AC"/><line x1="824" y1="210" x2="824" y2="445" stroke="#B8B4AC"/>
    <text x="80" y="250" font-weight="bold" fill="#C50000">做到哪一步</text><text x="80" y="326">已经完成了什么</text><text x="80" y="380">哪些结论已确认</text>
    <text x="472" y="250" font-weight="bold" fill="#C50000">手上有什么</text><text x="472" y="326">已有文件和参考资料</text><text x="472" y="380">本次要用哪一份</text>
