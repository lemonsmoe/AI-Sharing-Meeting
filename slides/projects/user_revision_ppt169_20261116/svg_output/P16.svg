    <text x="680" y="230" font-size="22">只有愿望：</text><text x="680" y="275">“帮我做得更好看一点。”</text>
    <text x="680" y="366" font-size="22" fill="#C50000">针对这张 PPT 的修改意见：</text>
    <text x="680" y="412">“左侧提示词太长，移到讲稿；</text><text x="680" y="456">统一字号，去掉左下角页脚；</text><text x="680" y="500">补上实际输入或结果图，</text><text x="680" y="544">让大家能直接看到例子。”</text>
