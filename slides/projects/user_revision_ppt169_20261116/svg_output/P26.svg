<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="zh-CN" font-family="Microsoft YaHei" font-size="28" data-pptx-page-role="content">
  <rect width="1280" height="720" fill="#F6F3EC"/>
  <text x="80" y="104" font-size="44" font-weight="bold" fill="#171715">公司表情包：把赛感标识变成日常角色</text>
  <image href="../images/meme_original_20261116.jpg" x="80" y="168" width="495" height="495" preserveAspectRatio="xMidYMid meet"/>
  <g id="meme-prompt" data-pptx-bounds="632 176 568 490" fill="#171715">
    <text x="632" y="218" font-weight="bold" fill="#C50000">4 × 4，共 16 个日常表情</text>
    <text x="632" y="284" font-size="22">“参考赛感 logo，设计一套 16 宫格表情包。
      <tspan x="632" dy="38">让红色标识成为卡通人物的头部，穿米色</tspan><tspan x="632" dy="38">连帽衫、蓝裤子和棕色鞋。使用温暖的</tspan><tspan x="632" dy="38">手绘风格、米白背景，保持角色一致。</tspan>
      <tspan x="632" dy="52">分别表现欢迎、早安、谢谢老板、收到、</tspan><tspan x="632" dy="38">打工、摸鱼、大笑、疑问、点赞、抱抱等</tspan><tspan x="632" dy="38">日常场景。每格配清楚的中文短句，</tspan><tspan x="632" dy="38">用不同的动作和道具表达情绪。”</tspan>
    </text>
    <text x="632" y="650" font-size="22" fill="#C50000">主体、布局、风格、动作、配字，一起说清楚。</text>
  </g>
</svg>
