    <text x="942" y="339" font-weight="bold">外部系统</text><text x="942" y="395">会议记录</text><text x="942" y="443">企业文档</text><text x="942" y="491">数据库／业务工具</text>
  </g>
  <text x="80" y="624" fill="#C50000">MCP 统一连接方式；接什么服务、能做什么，由具体接入和权限决定。</text>
