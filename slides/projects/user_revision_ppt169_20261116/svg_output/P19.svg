    <rect x="112" y="425" width="236" height="60" fill="#F6F3EC"/><text x="230" y="465" font-size="22" text-anchor="middle">MCP 客户端</text>
    <line x1="394" y1="365" x2="496" y2="365" stroke="#C50000" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="496" y1="445" x2="394" y2="445" stroke="#C50000" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="510" y="280" width="270" height="240" fill="#FFFFFF" stroke="#C50000" stroke-width="2"/>
    <text x="645" y="365" text-anchor="middle" font-weight="bold">MCP 服务端</text><text x="645" y="422" font-size="22" text-anchor="middle">提供可调用的工具</text><text x="645" y="463" font-size="22" text-anchor="middle">返回查询结果</text>
    <line x1="794" y1="365" x2="896" y2="365" stroke="#C50000" stroke-width="2" marker-end="url(#arrow)"/>
