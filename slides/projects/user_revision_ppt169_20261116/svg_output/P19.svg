<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="zh-CN" font-family="Microsoft YaHei" font-size="28" data-pptx-page-role="content">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#C50000"/></marker></defs>
  <rect width="1280" height="720" fill="#F6F3EC"/>
  <text x="80" y="104" font-size="44" font-weight="bold" fill="#171715">MCP：让 AI 应用连接外部工具和数据</text>
  <text x="80" y="184" fill="#171715">例如：“查一下昨天会议里，谁负责跟进这件事？”</text>
  <g id="mcp-path" data-pptx-bounds="80 258 1120 290" fill="#171715">
    <rect x="80" y="280" width="300" height="240" fill="#FFFFFF" stroke="#B8B4AC"/>
