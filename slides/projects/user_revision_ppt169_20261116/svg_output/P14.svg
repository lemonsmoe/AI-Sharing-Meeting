    <text x="120" y="265" font-size="28" font-weight="bold" fill="#171715">「做得高级一点」</text>
    <text x="120" y="325" font-size="24" fill="#7A7A74">风格、颜色、排版——</text>
    <text x="120" y="365" font-size="24" fill="#7A7A74">很多时候就是一种感觉，</text>
