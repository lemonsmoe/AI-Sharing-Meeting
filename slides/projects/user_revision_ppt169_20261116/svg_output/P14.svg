  <text x="80" y="580" font-family="Microsoft YaHei" font-size="28" font-weight="bold" fill="#171715">让它知道你的喜好，而不是靠猜。</text>
  <text x="80" y="630" font-family="Microsoft YaHei" font-size="24" fill="#7A7A74">同时，用文字说清需求的能力，仍然值得练。</text>
