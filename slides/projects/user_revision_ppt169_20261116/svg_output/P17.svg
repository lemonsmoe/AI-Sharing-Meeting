<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="zh-CN" font-family="Microsoft YaHei" font-size="28" data-pptx-page-role="content">
  <rect width="1280" height="720" fill="#F6F3EC"/>
  <text x="80" y="104" font-size="44" font-weight="bold" fill="#171715">答案顺不顺，和答没答对是两回事</text>
  <text x="80" y="175" fill="#171715">AI 幻觉：生成内容与事实、任务或材料不一致。</text>
  <g id="hallucination" data-pptx-bounds="80 210 1120 350" fill="#171715">
    <rect x="80" y="210" width="540" height="130" fill="#FFFFFF"/><rect x="660" y="210" width="540" height="130" fill="#FFFFFF"/>
    <text x="112" y="260" font-weight="bold" fill="#C50000">事实性幻觉</text><text x="112" y="308" font-size="22">事实错误，或编造无法证实的信息</text>
    <text x="692" y="260" font-weight="bold" fill="#C50000">忠实性幻觉</text><text x="692" y="308" font-size="22">偏离任务、材料，或前后逻辑矛盾</text>
    <text x="80" y="420" font-weight="bold">造成幻觉的常见原因</text>
    <text x="80" y="475">训练目标与事实核验的差距：预测后续内容，不等于核实事实。</text><text x="80" y="528">数据质量与知识边界：错误、过时信息，以及领域知识不足。</text>
  </g>
  <rect x="80" y="590" width="1120" height="70" fill="#171715"/>
  <text x="112" y="635" fill="#FFFFFF">给原始材料　·　要求标明来源　·　检查关键数字和结论</text>
</svg>
