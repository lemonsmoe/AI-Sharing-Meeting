    <text x="120" y="270" font-size="26" font-weight="bold" fill="#171715">skill 文件夹</text>
    <rect x="120" y="300" width="480" height="52" rx="8" fill="#F6F3EC" stroke="#E3DFD5" stroke-width="1.5"/>
    <text x="150" y="335" font-size="22" fill="#171715">SKILL.md——适合干什么、要什么材料、步骤怎么走</text>
    <rect x="120" y="364" width="480" height="52" rx="8" fill="#F6F3EC" stroke="#E3DFD5" stroke-width="1.5"/>
    <text x="150" y="399" font-size="22" fill="#171715">模板、参考样例</text>
    <rect x="120" y="428" width="480" height="52" rx="8" fill="#F6F3EC" stroke="#E3DFD5" stroke-width="1.5"/>
