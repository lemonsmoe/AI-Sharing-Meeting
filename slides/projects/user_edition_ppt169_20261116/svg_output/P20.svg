  <text x="80" y="160" font-family="Microsoft YaHei" font-size="26" fill="#171715">接下来从一个具体的 AI 工作平台出发，讲讲它的使用。</text>
  <g data-pptx-bounds="0 0 1280 720" font-family="Microsoft YaHei" font-size="22" fill="#171715" text-anchor="middle">
    <image x="140" y="240" width="72" height="72" href="../images/icons/doubao.png"/>
    <text x="176" y="344">豆包</text>
    <image x="340" y="240" width="72" height="72" href="../images/icons/openai.png"/>
    <text x="376" y="344">ChatGPT</text>
    <image x="540" y="240" width="72" height="72" href="../images/icons/anthropic.png"/>
    <text x="576" y="344">Claude</text>
    <rect x="720" y="240" width="72" height="72" rx="14" fill="#171715"/>
    <text x="756" y="288" font-size="30" font-weight="bold" fill="#FFFFFF">WB</text>
    <text x="756" y="344">WorkBuddy</text>
    <image x="920" y="240" width="72" height="72" href="../images/icons/deepseek.png"/>
    <text x="956" y="344">DeepSeek Harness</text>
    <image x="1120" y="240" width="72" height="72" href="../images/icons/xiaoyunque.png"/>
    <text x="1156" y="344">小云雀</text>
