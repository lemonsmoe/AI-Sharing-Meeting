  <text x="80" y="520" font-family="Microsoft YaHei" font-size="28" fill="#171715">这类平台不只是聊天：权限合适时，它能读文件、写文件、自动化地干活，</text>
  <text x="80" y="566" font-family="Microsoft YaHei" font-size="28" fill="#171715">甚至操作你的电脑——它就是一张办公桌。</text>
