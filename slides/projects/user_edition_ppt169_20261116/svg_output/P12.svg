<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect width="1280" height="720" fill="#F6F3EC"/>
  <text x="80" y="104" font-family="Microsoft YaHei" font-size="44" font-weight="bold" fill="#171715">提示词 1｜准确详细地描述需求</text>
  <g data-pptx-bounds="0 0 1280 720" font-family="Microsoft YaHei">
    <rect x="80" y="200" width="460" height="260" rx="12" fill="#FFFFFF" stroke="#E3DFD5" stroke-width="1.5"/>
    <text x="120" y="300" font-size="40" fill="#171715">「帮我改一下」</text>
    <text x="120" y="380" font-size="24" fill="#7A7A74">只有五个字——</text>
    <text x="120" y="420" font-size="24" fill="#7A7A74">对方只能先反问：嫌字多，还是排得乱？</text>
    <text x="640" y="330" font-size="40" fill="#C50000">→</text>
    <rect x="740" y="200" width="460" height="260" rx="12" fill="#FFFFFF" stroke="#C50000" stroke-width="2"/>
