<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect width="1280" height="720" fill="#F6F3EC"/>
  <text x="80" y="104" font-family="Microsoft YaHei" font-size="44" font-weight="bold" fill="#171715">Harness 与 Agent</text>
  <g data-pptx-bounds="0 0 1280 720" font-family="Microsoft YaHei">
    <rect x="80" y="200" width="540" height="260" rx="12" fill="#FFFFFF" stroke="#E3DFD5" stroke-width="1.5"/>
    <text x="120" y="265" font-size="30" font-weight="bold" fill="#171715">Harness＝调度与护栏</text>
    <text x="120" y="325" font-size="24" fill="#171715">管权限 · 管工具调用</text>
    <text x="120" y="365" font-size="24" fill="#171715">管检查点 · 断了怎么接着干</text>
    <rect x="660" y="200" width="540" height="260" rx="12" fill="#FFFFFF" stroke="#C50000" stroke-width="2"/>
    <text x="700" y="265" font-size="30" font-weight="bold" fill="#C50000">Agent＝把事干完的那一位</text>
    <text x="700" y="325" font-size="24" fill="#171715">任务、Skill、MCP 接进来的工具、</text>
    <text x="700" y="365" font-size="24" fill="#171715">Harness 的调度，最后都汇聚在它身上</text>
  </g>
  <text x="80" y="560" font-family="Microsoft YaHei" font-size="28" fill="#171715">Prompt 给任务 → Skill 给做法 → MCP 接工具 → Harness 管执行 → Agent 把一件事从头干到尾。</text>
</svg>
