<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect width="1280" height="720" fill="#F6F3EC"/>
  <text x="80" y="104" font-family="Microsoft YaHei" font-size="44" font-weight="bold" fill="#171715">这份 PPT 就是咱们用 AI 做出来的</text>
  <text x="80" y="158" font-family="Microsoft YaHei" font-size="26" fill="#171715">先写大纲，再理顺序、试版式，一页一页做进去——会后谁要拿去用，还能接着改</text>
  <g data-pptx-bounds="0 0 1280 720" font-family="Microsoft YaHei" font-size="22">
    <rect x="80" y="240" width="236" height="96" rx="10" fill="#FFFFFF" stroke="#E3DFD5" stroke-width="1.5"/>
    <circle cx="126" cy="288" r="20" fill="#C50000"/>
    <text x="126" y="296" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="166" y="296" fill="#171715">先写大纲</text>
    <rect x="336" y="240" width="236" height="96" rx="10" fill="#FFFFFF" stroke="#E3DFD5" stroke-width="1.5"/>
    <circle cx="382" cy="288" r="20" fill="#C50000"/>
    <text x="382" y="296" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="422" y="296" fill="#171715">理清顺序</text>
    <rect x="592" y="240" width="236" height="96" rx="10" fill="#FFFFFF" stroke="#E3DFD5" stroke-width="1.5"/>
    <circle cx="638" cy="288" r="20" fill="#C50000"/>
    <text x="638" y="296" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="678" y="296" fill="#171715">试版式</text>
    <rect x="848" y="240" width="236" height="96" rx="10" fill="#FFFFFF" stroke="#E3DFD5" stroke-width="1.5"/>
    <circle cx="894" cy="288" r="20" fill="#C50000"/>
    <text x="894" y="296" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="934" y="296" fill="#171715">一页页做进去</text>
  </g>
  <image x="680" y="392" width="520" height="292" href="../images/sample_01.png" preserveAspectRatio="xMidYMid meet"/>
