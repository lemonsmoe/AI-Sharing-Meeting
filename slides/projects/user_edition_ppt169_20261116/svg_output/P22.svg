<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect width="1280" height="720" fill="#F6F3EC"/>
  <text x="80" y="104" font-family="Microsoft YaHei" font-size="44" font-weight="bold" fill="#171715">第一次，只交一个小任务</text>
  <g data-pptx-bounds="0 0 1280 720" font-family="Microsoft YaHei">
    <rect x="80" y="180" width="1120" height="170" rx="12" fill="#FFFFFF" stroke="#E3DFD5" stroke-width="1.5"/>
    <text x="120" y="235" font-size="24" font-weight="bold" fill="#C50000">任务里这样写：</text>
    <text x="120" y="290" font-size="24" fill="#171715">「先找出时间、地点、参加方式的差异。给我一张表，每行附来源。</text>
    <text x="120" y="330" font-size="24" fill="#171715">先告诉我你会读哪两份文件，生成后放在这个目录里。」</text>
    <rect x="80" y="390" width="1120" height="160" rx="12" fill="#FFFFFF" stroke="#E3DFD5" stroke-width="1.5"/>
    <text x="120" y="445" font-size="24" font-weight="bold" fill="#171715">拿到结果，自己验收一遍：</text>
    <text x="120" y="500" font-size="24" fill="#171715">打开文件，随便查一行日期 → 看能不能按来源找回原件 → 两处冲突，看它有没有把冲突留给你</text>
  </g>
  <text x="80" y="630" font-family="Microsoft YaHei" font-size="28" font-weight="bold" fill="#171715">你当老板，它当员工；许愿许得够精确，它就能把任务干出来。</text>
</svg>
