    <rect x="840" y="200" width="360" height="260" rx="12" fill="#FFFFFF" stroke="#E3DFD5" stroke-width="1.5"/>
    <text x="880" y="270" font-size="28" font-weight="bold" fill="#171715">操作你的电脑</text>
    <text x="880" y="330" font-size="22" fill="#171715">控制鼠标帮你点按钮（效果另说）</text>
